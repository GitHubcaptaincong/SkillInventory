resolver 127.0.0.11 valid=10s;
upstream skill_backend {
    zone skill_backend 64k;
    server backend:8080 resolve;
}
server {
    listen 80;
    # No credential, query or body access logs.
    access_log off;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Request-Id $request_id always;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Request limit is 2 MiB","requestId":"$request_id"}';
    }
    location /api/ {
        proxy_pass http://skill_backend;
        proxy_cache off;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
